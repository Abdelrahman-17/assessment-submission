[webservers]
# Local lab mode used for this assessment environment.
# Replace these two entries with the IP addresses/SSH settings of two Linux VMs
# when running against real remote VMs.
vm1 ansible_host=127.0.0.1 ansible_connection=local
vm2 ansible_host=127.0.0.1 ansible_connection=local

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
