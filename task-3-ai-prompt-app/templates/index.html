<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Prompt Web App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f9f9f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        textarea, select { width: 100%; padding: 12px; margin-top: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .response-box, .error-box { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .response-box { background: #e9ecef; border-left: 4px solid #007bff; }
        .error-box { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .nav-links { margin-bottom: 20px; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/history">View History & CSV Export</a>
        </div>
        <h1>🤖 AI Prompt Web App</h1>
        <form method="POST" action="/">
            <label>Select Prompt Template:</label>
            <select name="template">
                <option value="General Assistant">General Assistant</option>
                <option value="Code Review & Debugging">Code Review & Debugging</option>
                <option value="Text Summarization">Text Summarization</option>
                <option value="DevOps & Infrastructure">DevOps & Infrastructure</option>
            </select>
            
            <label>Enter your prompt:</label>
            <textarea name="prompt" rows="5" placeholder="Type your prompt here..." required></textarea>
            
            <button type="submit">Submit Prompt</button>
        </form>

        {% if response %}
            <div class="response-box">
                <strong>AI Response:</strong>
                <p>{{ response }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
