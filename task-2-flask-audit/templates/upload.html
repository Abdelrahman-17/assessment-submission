{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4>Upload Configuration & Log Files</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Network Config Files (.txt)</label>
                        <input type="file" name="configs" class="form-control" multiple>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Syslog Files (.txt/.log)</label>
                        <input type="file" name="logs" class="form-control" multiple>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Upload & Analyze</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
