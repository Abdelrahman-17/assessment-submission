{% extends 'base.html' %}{% block title %}Upload Files{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-4"><h2>Upload Configurations & Logs</h2><p class="text-muted">Upload multiple Cisco, Huawei, or Juniper configuration files and multiple .log/.txt files.</p><form method="post" enctype="multipart/form-data"><label class="form-label fw-bold">Configuration files</label><input class="form-control mb-3" type="file" name="configs" multiple accept=".txt,.cfg,.conf"><label class="form-label fw-bold">Log files</label><input class="form-control mb-3" type="file" name="logs" multiple accept=".txt,.log"><button class="btn btn-success">Upload & Run Audit</button></form></div></div></div></div>
{% endblock %}
